{
  "name": "Publish immutable Birostris 0.2.0 source materials",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/publish-birostris-0200-sources.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "publish-birostris-0200-corresponding-sources",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Verify and publish the six fixed corresponding-source files",
          "shell": "python",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}",
            "SOURCE_HELPER_BASE64": "",
            "SOURCE_MANIFEST_BASE64": "",
            "SOURCE_SIGNATURE_BASE64": ""
          },
          "run": "import base64, hashlib, io, json, os, re, sys, urllib.error, urllib.parse, urllib.request, zipfile\n\nREPOSITORY = \"12D025Codex/Birostris-Public\"\nTAG = \"birostris-viewer-0.2.0-compliance\"\nOLD_TAG = \"birostris-viewer-0.1.20-compliance\"\nMANIFEST_SHA256 = \"a143f015c4723aa7023807783234f3b6c4cdda7ec07e00deec31411f3e36f951\"\nSIGNING_PUBLIC_KEY = \"MCowBQYDK2VwAyEAULvsmm0P0xusCQhsLnBLyQUKLvyGE+FhAr0WbgOZHkU=\"\nEXPECTED = [{\"name\":\"birostrisviewer-0.1.18-windows-ffmpeg-source-kit-652f9e7e42ed4205.zip\",\"bytes\":47023272,\"sha256\":\"652f9e7e42ed4205ecaa435b15561390281ff799d3e2536b14c1faa00212b6cb\",\"historicalUrl\":\"https://github.com/12D025Codex/Birostris-Public/releases/download/birostris-viewer-0.1.20-compliance/birostrisviewer-0.1.18-windows-ffmpeg-source-kit-652f9e7e42ed4205.zip\"},{\"name\":\"birostris-0.1.17-desugar-source-08a00e67c58ea5bb.zip\",\"bytes\":30045138,\"sha256\":\"08a00e67c58ea5bbc40c124bf19b19a62288ca796c3e2d16b8c910a53e09025d\",\"historicalUrl\":\"https://github.com/12D025Codex/Birostris-Public/releases/download/birostris-viewer-0.1.20-compliance/birostris-0.1.17-desugar-source-08a00e67c58ea5bb.zip\"},{\"name\":\"birostrisviewer-0.1.18-onnx-eigen-source-kit-8d7ae3620655eaa1.zip\",\"bytes\":3952513,\"sha256\":\"8d7ae3620655eaa1f8302901e08fab032cb6f1954b32680f5e45ccee3ec5b23f\",\"historicalUrl\":\"https://github.com/12D025Codex/Birostris-Public/releases/download/birostris-viewer-0.1.20-compliance/birostrisviewer-0.1.18-onnx-eigen-source-kit-8d7ae3620655eaa1.zip\"},{\"name\":\"birostrisviewer-0.2.0-windows-helper-application-source-73eee56730e28115.zip\",\"bytes\":28126,\"sha256\":\"73eee56730e28115ca402329d66c7e554ce3bed438eb95873bf20e13ea9ab0bc\",\"embedded\":\"SOURCE_HELPER_BASE64\"},{\"name\":\"SOURCE-MANIFEST.json\",\"bytes\":11194,\"sha256\":\"a143f015c4723aa7023807783234f3b6c4cdda7ec07e00deec31411f3e36f951\",\"embedded\":\"SOURCE_MANIFEST_BASE64\"},{\"name\":\"SOURCE-MANIFEST.signature.json\",\"bytes\":318,\"sha256\":\"1fa4ff82caed42b293fa4dc0a5a3459473ff8a9f1922600d8de0d5c416af8dc7\",\"embedded\":\"SOURCE_SIGNATURE_BASE64\"}]\nNAMES = {row[\"name\"] for row in EXPECTED}\nPREFIX = \"/repos/\" + REPOSITORY\n\nclass ApiStatus(Exception):\n    def __init__(self, status): self.status = status\n\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self, req, fp, code, msg, headers, newurl): return None\n\n# Distinct openers: public archive requests never receive authorization, and\n# authenticated GitHub REST requests reject every redirect before following it.\nAUTH_OPENER = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())\nPUBLIC_OPENER = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())\n\ndef require(value, message):\n    if not value: raise RuntimeError(message)\n\ndef checked_bytes(row, data):\n    require(len(data) == row[\"bytes\"] and hashlib.sha256(data).hexdigest() == row[\"sha256\"], \"Fixed source byte/hash mismatch\")\n    return data\n\ndef api_json(endpoint, method=\"GET\", data=None, upload=False):\n    if upload:\n        require(method == \"POST\" and isinstance(data, bytes), \"Invalid source upload method\")\n        parsed = urllib.parse.urlsplit(endpoint)\n        match = re.fullmatch(re.escape(PREFIX) + r\"/releases/([1-9][0-9]*)/assets\", parsed.path)\n        query = urllib.parse.parse_qs(parsed.query, strict_parsing=True)\n        require(match and set(query) == {\"name\"} and len(query[\"name\"]) == 1 and query[\"name\"][0] in NAMES, \"Invalid source upload endpoint\")\n        require(not parsed.scheme and not parsed.netloc and not parsed.fragment, \"Invalid source upload authority\")\n        url = \"https://uploads.github.com\" + endpoint\n        body = data\n    else:\n        allowed = endpoint in [PREFIX, PREFIX + \"/releases\", PREFIX + \"/releases/tags/\" + TAG]\n        allowed = allowed or re.fullmatch(re.escape(PREFIX) + r\"/releases/[1-9][0-9]*/assets\\?per_page=100\", endpoint)\n        require(allowed and method in [\"GET\", \"POST\"] and (method != \"POST\" or endpoint == PREFIX + \"/releases\"), \"Invalid GitHub REST endpoint\")\n        url = \"https://api.github.com\" + endpoint\n        body = None if data is None else json.dumps(data, separators=(\",\", \":\")).encode()\n    token = os.environ.get(\"GITHUB_TOKEN\", \"\")\n    require(bool(token), \"Repository-scoped GITHUB_TOKEN unavailable\")\n    headers = {\"Authorization\": \"Bearer \" + token, \"User-Agent\": \"Birostris-fixed-source-publisher/0.2.0\", \"Accept\": \"application/vnd.github+json\", \"X-GitHub-Api-Version\": \"2022-11-28\"}\n    if body is not None: headers[\"Content-Type\"] = \"application/octet-stream\" if upload else \"application/json\"\n    request = urllib.request.Request(url, data=body, headers=headers, method=method)\n    try:\n        with AUTH_OPENER.open(request, timeout=120) as response:\n            require(response.status in [200, 201], \"Unexpected GitHub REST status\")\n            raw = response.read(4 * 1024 * 1024 + 1)\n            require(len(raw) <= 4 * 1024 * 1024, \"GitHub REST response too large\")\n            return json.loads(raw)\n    except urllib.error.HTTPError as failure:\n        # Never echo response bodies, bearer values or signed redirect URLs.\n        raise ApiStatus(failure.code) from None\n    except (urllib.error.URLError, TimeoutError):\n        raise RuntimeError(\"GitHub REST unavailable\") from None\n\ndef anonymous_download(row, tag):\n    require(tag in [TAG, OLD_TAG] and row[\"name\"] in NAMES, \"Unexpected public source name\")\n    url = \"https://github.com/\" + REPOSITORY + \"/releases/download/\" + tag + \"/\" + row[\"name\"]\n    for hop in range(4):\n        target = urllib.parse.urlsplit(url)\n        require(target.scheme == \"https\" and target.port is None and target.username is None and target.password is None and not target.fragment, \"Unsafe anonymous source location\")\n        if hop == 0:\n            require(target.netloc == \"github.com\" and not target.query, \"Unexpected public source origin\")\n        else:\n            require(target.netloc == \"release-assets.githubusercontent.com\" and target.path.startswith(\"/github-production-release-asset/\"), \"Unexpected anonymous CDN origin\")\n        request = urllib.request.Request(url, headers={\"User-Agent\": \"Birostris-anonymous-source-readback/0.2.0\", \"Accept\": \"application/octet-stream\"}, method=\"GET\")\n        require(not request.has_header(\"Authorization\"), \"Public download cannot carry credentials\")\n        try:\n            with PUBLIC_OPENER.open(request, timeout=120) as response:\n                require(response.status == 200, \"Anonymous source did not return 200\")\n                length = response.headers.get(\"Content-Length\")\n                require(length is None or int(length) == row[\"bytes\"], \"Anonymous source declared size mismatch\")\n                parts, count, digest = [], 0, hashlib.sha256()\n                while True:\n                    chunk = response.read(256 * 1024)\n                    if not chunk: break\n                    count += len(chunk)\n                    require(count <= row[\"bytes\"], \"Anonymous source exceeds fixed bound\")\n                    digest.update(chunk); parts.append(chunk)\n                require(count == row[\"bytes\"] and digest.hexdigest() == row[\"sha256\"], \"Anonymous source integrity mismatch\")\n                return b\"\".join(parts)\n        except urllib.error.HTTPError as failure:\n            require(failure.code == 302 and hop < 3, \"Anonymous source request failed\")\n            location = failure.headers.get(\"Location\", \"\")\n            require(bool(location), \"Anonymous source redirect missing\")\n            url = location  # Validated next iteration; never logged or given credentials.\n        except (urllib.error.URLError, TimeoutError):\n            raise RuntimeError(\"Anonymous source unavailable\") from None\n    raise RuntimeError(\"Anonymous source redirect limit\")\n\ndef verify_embedded_materials(materials):\n    manifest_bytes = materials[\"SOURCE-MANIFEST.json\"]\n    require(hashlib.sha256(manifest_bytes).hexdigest() == MANIFEST_SHA256, \"Exact signed manifest bytes required\")\n    manifest = json.loads(manifest_bytes)\n    signature = json.loads(materials[\"SOURCE-MANIFEST.signature.json\"])\n    # The local preflight verifies Ed25519 before these immutable bytes are\n    # embedded. This stdlib-only publisher never signs or substitutes a key.\n    require(signature[\"algorithm\"] == \"Ed25519\" and signature[\"publicKey\"] == SIGNING_PUBLIC_KEY and signature[\"manifestSha256\"] == MANIFEST_SHA256 and len(base64.b64decode(signature[\"signature\"], validate=True)) == 64, \"Fixed source signature envelope differs\")\n    require(manifest[\"appVersion\"] == \"0.2.0\" and manifest[\"repository\"] == REPOSITORY and manifest[\"tag\"] == TAG, \"Wrong source manifest identity\")\n    components = manifest[\"components\"] + [manifest[\"applicationSource\"]]\n    require(len(components) == 4 and {c[\"component\"] for c in components} == {\"electron-ffmpeg\", \"desugar\", \"onnx-eigen\", \"windows-media-application\"}, \"Exact four source components required\")\n    for component in components:\n        name = component[\"url\"].rsplit(\"/\", 1)[1]\n        row = next((r for r in EXPECTED if r[\"name\"] == name), None)\n        require(row and component[\"url\"] == \"https://github.com/\" + REPOSITORY + \"/releases/download/\" + TAG + \"/\" + name and component[\"sourceApplicableToVersion\"] == \"0.2.0\" and component[\"archive\"][\"bytes\"] == row[\"bytes\"] and component[\"archive\"][\"sha256\"] == row[\"sha256\"], \"Signed source plan mapping differs\")\n    app = manifest[\"applicationSource\"]\n    helper_name = app[\"url\"].rsplit(\"/\", 1)[1]\n    rows = app[\"files\"]\n    require(len(rows) == 20 and len({row[\"path\"] for row in rows}) == 20, \"Exact helper source inventory required\")\n    with zipfile.ZipFile(io.BytesIO(materials[helper_name])) as archive:\n        names = archive.namelist()\n        require(len(names) == 21 and set(names) == {row[\"path\"] for row in rows} | {\"SOURCE-ARCHIVE-MANIFEST.json\"} and archive.testzip() is None, \"Helper archive inventory/CRC differs\")\n        for row in rows: checked_bytes(row, archive.read(row[\"path\"]))\n        internal = json.loads(archive.read(\"SOURCE-ARCHIVE-MANIFEST.json\"))\n        require(internal[\"applicationVersion\"] == \"0.2.0\" and internal[\"credentialsIncluded\"] is False and internal[\"signingKeysIncluded\"] is False and internal[\"files\"] == rows, \"Helper internal manifest differs\")\n\ndef list_assets(release_id):\n    assets = api_json(PREFIX + \"/releases/\" + str(release_id) + \"/assets?per_page=100\")\n    require(isinstance(assets, list) and len(assets) <= 6 and len({a.get(\"name\") for a in assets}) == len(assets) and all(a.get(\"name\") in NAMES for a in assets), \"Refuse release with unexpected/duplicate source assets\")\n    return {asset[\"name\"]: asset for asset in assets}\n\ndef main():\n    require(os.environ.get(\"GITHUB_REPOSITORY\") == REPOSITORY and os.environ.get(\"GITHUB_EVENT_NAME\") == \"push\" and os.environ.get(\"GITHUB_REF\") == \"refs/heads/main\", \"Publisher runs only for this repository main push\")\n    commit = os.environ.get(\"GITHUB_SHA\", \"\")\n    require(re.fullmatch(r\"[a-f0-9]{40}\", commit), \"Exact workflow commit required\")\n    require(len(EXPECTED) == 6 and len(NAMES) == 6, \"Exact six immutable files required\")\n    materials = {}\n    for row in EXPECTED:\n        data = base64.b64decode(os.environ[row[\"embedded\"]], validate=True) if \"embedded\" in row else anonymous_download(row, OLD_TAG)\n        materials[row[\"name\"]] = checked_bytes(row, data)\n    verify_embedded_materials(materials)\n    repository = api_json(PREFIX)\n    require(repository.get(\"full_name\") == REPOSITORY and repository.get(\"private\") is False, \"Intended public source repository required\")\n    try:\n        release = api_json(PREFIX + \"/releases/tags/\" + TAG)\n    except ApiStatus as failure:\n        require(failure.status == 404, \"Source release lookup failed\")\n        release = api_json(PREFIX + \"/releases\", \"POST\", {\"tag_name\": TAG, \"target_commitish\": commit, \"name\": \"Birostris Viewer 0.2.0 corresponding sources\", \"body\": \"Permanent corresponding sources: three unchanged historical library source kits, current Windows helper source and exact signed source/binary mapping. Existing historical releases remain untouched. No app binaries, user content, credentials or signing keys.\", \"draft\": False, \"prerelease\": False, \"make_latest\": \"false\"})\n    require(release.get(\"tag_name\") == TAG and release.get(\"draft\") is False and type(release.get(\"id\")) is int and release[\"id\"] > 0, \"Unexpected source release identity\")\n    release_id = release[\"id\"]\n    existing = list_assets(release_id)\n    for row in EXPECTED:\n        old = existing.get(row[\"name\"])\n        if old:\n            require(old.get(\"size\") == row[\"bytes\"] and old.get(\"state\") == \"uploaded\", \"Refuse to replace an existing source asset\")\n            checked_bytes(row, anonymous_download(row, TAG))\n            continue\n        endpoint = PREFIX + \"/releases/\" + str(release_id) + \"/assets?\" + urllib.parse.urlencode({\"name\": row[\"name\"]})\n        uploaded = api_json(endpoint, \"POST\", materials[row[\"name\"]], upload=True)\n        require(uploaded.get(\"name\") == row[\"name\"] and uploaded.get(\"size\") == row[\"bytes\"] and uploaded.get(\"state\") == \"uploaded\", \"Uploaded source metadata differs\")\n    final = list_assets(release_id)\n    require(set(final) == NAMES, \"Permanent source release incomplete\")\n    for row in EXPECTED: checked_bytes(row, anonymous_download(row, TAG))\n    print(json.dumps({\"published\": True, \"repository\": REPOSITORY, \"tag\": TAG, \"files\": [{k: row[k] for k in [\"name\", \"bytes\", \"sha256\"]} for row in EXPECTED], \"anonymousReadbackVerified\": True, \"historicalReleasesModified\": False, \"appPromotionPerformed\": False}))\n\nif __name__ == \"__main__\":\n    try: main()\n    except Exception:\n        print(\"Fixed source publication failed closed; inspect non-secret GitHub metadata. No existing asset was overwritten.\", file=sys.stderr)\n        sys.exit(1)\n"
        }
      ]
    }
  }
}
