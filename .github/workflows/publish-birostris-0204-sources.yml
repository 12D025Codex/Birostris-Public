{
  "name": "Publish immutable Birostris 0.2.4 corresponding sources",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/publish-birostris-0204-sources.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "publish-birostris-0204-corresponding-sources",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 60,
      "steps": [
        {
          "name": "Reconstruct, verify, publish and anonymously read all fixed source bytes",
          "shell": "python",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}",
            "HELPER_SOURCE_BASE64": "",
            "SOURCE_MANIFEST_BASE64": "",
            "SOURCE_SIGNATURE_BASE64": ""
          },
          "run": "\"\"\"Runs only as the fixed public repository Actions main-push source publisher.\"\"\"\nimport base64, hashlib, io, json, os, re, sys, urllib.error, urllib.parse, urllib.request, zipfile, zlib, tempfile, pathlib, concurrent.futures\nCONFIG={'repository': '12D025Codex/Birostris-Public', 'version': '0.2.4', 'tag': 'birostris-viewer-0.2.4-compliance', 'manifestSha256': '1ec98e7dae013353a4a9c758261abd869f664d86ea2fa0bcd95cdb8bed43d35d', 'signingPublicKey': 'MCowBQYDK2VwAyEAULvsmm0P0xusCQhsLnBLyQUKLvyGE+FhAr0WbgOZHkU=', 'expected': [{'name': 'birostrisviewer-0.1.18-windows-ffmpeg-source-kit-652f9e7e42ed4205.zip', 'bytes': 47023272, 'sha256': '652f9e7e42ed4205ecaa435b15561390281ff799d3e2536b14c1faa00212b6cb', 'component': 'electron-ffmpeg', 'historicalUrl': 'https://github.com/12D025Codex/Birostris-Public/releases/download/birostris-viewer-0.2.1-compliance/birostrisviewer-0.1.18-windows-ffmpeg-source-kit-652f9e7e42ed4205.zip'}, {'name': 'birostris-0.1.17-desugar-source-08a00e67c58ea5bb.zip', 'bytes': 30045138, 'sha256': '08a00e67c58ea5bbc40c124bf19b19a62288ca796c3e2d16b8c910a53e09025d', 'component': 'desugar', 'historicalUrl': 'https://github.com/12D025Codex/Birostris-Public/releases/download/birostris-viewer-0.2.1-compliance/birostris-0.1.17-desugar-source-08a00e67c58ea5bb.zip'}, {'name': 'birostrisviewer-0.1.18-onnx-eigen-source-kit-8d7ae3620655eaa1.zip', 'bytes': 3952513, 'sha256': '8d7ae3620655eaa1f8302901e08fab032cb6f1954b32680f5e45ccee3ec5b23f', 'component': 'onnx-eigen', 'historicalUrl': 'https://github.com/12D025Codex/Birostris-Public/releases/download/birostris-viewer-0.2.1-compliance/birostrisviewer-0.1.18-onnx-eigen-source-kit-8d7ae3620655eaa1.zip'}, {'name': 'birostrisviewer-0.2.4-windows-helper-application-source-280db36b959423c0.zip', 'bytes': 28790, 'sha256': '280db36b959423c07bdbe0b988f440841418c0d2da30c997ac3347c155998085', 'component': 'windows-media-application', 'embedded': 'HELPER_SOURCE_BASE64'}, {'name': 'SOURCE-MANIFEST.json', 'bytes': 13176, 'sha256': '1ec98e7dae013353a4a9c758261abd869f664d86ea2fa0bcd95cdb8bed43d35d', 'embedded': 'SOURCE_MANIFEST_BASE64'}, {'name': 'SOURCE-MANIFEST.signature.json', 'bytes': 318, 'sha256': '8aafcd7af094579fc992a329ff96fb36d809ca69a2cbd644fa249c1a764a4fc2', 'embedded': 'SOURCE_SIGNATURE_BASE64'}]}\nREPOSITORY=CONFIG['repository'];TAG=CONFIG['tag'];VERSION=CONFIG['version'];EXPECTED=CONFIG['expected'];NAMES={r['name']for r in EXPECTED};PREFIX='/repos/'+REPOSITORY\nclass ApiStatus(Exception):\n    def __init__(self,status):self.status=status\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self,req,fp,code,msg,headers,newurl):return None\nAUTH=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())\nPUBLIC=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())\ndef require(value,message):\n    if not value:raise RuntimeError(message)\ndef checked(row,data):\n    require(len(data)==row['bytes']and hashlib.sha256(data).hexdigest()==row['sha256'],'Fixed source bytes differ');return data\ndef api(endpoint,method='GET',data=None,upload=False):\n    if upload:\n        parsed=urllib.parse.urlsplit(endpoint);query=urllib.parse.parse_qs(parsed.query,strict_parsing=True)\n        require(method=='POST'and isinstance(data,bytes)and re.fullmatch(re.escape(PREFIX)+r'/releases/[1-9][0-9]*/assets',parsed.path)and set(query)=={'name'}and len(query['name'])==1 and query['name'][0]in NAMES and not parsed.scheme and not parsed.netloc and not parsed.fragment,'Unsafe upload endpoint');url='https://uploads.github.com'+endpoint;body=data\n    else:\n        require(method in('GET','POST')and(endpoint in(PREFIX,PREFIX+'/releases',PREFIX+'/releases/tags/'+TAG)or re.fullmatch(re.escape(PREFIX)+r'/releases/[1-9][0-9]*/assets\\?per_page=100',endpoint))and(method!='POST'or endpoint==PREFIX+'/releases'),'Unsafe GitHub endpoint');url='https://api.github.com'+endpoint;body=None if data is None else json.dumps(data,separators=(',',':')).encode()\n    token=os.environ.get('GITHUB_TOKEN','');require(token,'Repository-scoped Actions token unavailable');headers={'Authorization':'Bearer '+token,'User-Agent':'Birostris-fixed-source-publisher/'+VERSION,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}\n    if body is not None:headers['Content-Type']='application/octet-stream'if upload else'application/json'\n    try:\n        with AUTH.open(urllib.request.Request(url,data=body,headers=headers,method=method),timeout=1800)as response:\n            require(response.status in(200,201),'Unexpected GitHub status');raw=response.read(4*1024*1024+1);require(len(raw)<=4*1024*1024,'GitHub response too large');return json.loads(raw)\n    except urllib.error.HTTPError as failure:raise ApiStatus(failure.code)from None\n    except(urllib.error.URLError,TimeoutError):raise RuntimeError('GitHub API unavailable')from None\ndef public_bytes(row,url,source=False):\n    for hop in range(4):\n        parsed=urllib.parse.urlsplit(url);require(parsed.scheme=='https'and parsed.port is None and parsed.username is None and parsed.password is None and not parsed.fragment,'Unsafe public source URL')\n        if source:require(hop==0 and(parsed.netloc=='codeload.github.com'or parsed.netloc=='storage.googleapis.com'and parsed.path.startswith('/moz-fx-translations-data--303e-prod-translations-data/')or parsed.netloc=='raw.githubusercontent.com'and parsed.path.startswith('/mozilla-firefox/firefox/2c8de06acae0a9edcbd1e0e49f951a0cbfe427a2/')),'Unexpected pinned source origin')\n        elif hop==0:require(parsed.netloc=='github.com'and parsed.path.startswith('/'+REPOSITORY+'/releases/download/')and not parsed.query,'Unexpected public release origin')\n        else:require(parsed.netloc=='release-assets.githubusercontent.com'and parsed.path.startswith('/github-production-release-asset/'),'Unexpected public source CDN')\n        request=urllib.request.Request(url,headers={'User-Agent':'Birostris-anonymous-source-readback/'+VERSION,'Accept':'application/octet-stream'});require(not request.has_header('Authorization'),'Anonymous requests must not carry credentials')\n        try:\n            with PUBLIC.open(request,timeout=900)as response:\n                require(response.status==200,'Public source did not return200');length=response.headers.get('Content-Length');require(length is None or int(length)==row['bytes'],'Public source declared size differs');parts=[];count=0;digest=hashlib.sha256()\n                for block in iter(lambda:response.read(1024*1024),b''):\n                    count+=len(block);require(count<=row['bytes'],'Source exceeds fixed size');digest.update(block);parts.append(block)\n                require(count==row['bytes']and digest.hexdigest()==row['sha256'],'Anonymous full-byte source integrity differs');return b''.join(parts)\n        except urllib.error.HTTPError as failure:\n            require(not source and failure.code==302 and hop<3,'Anonymous source HTTP failure');url=failure.headers.get('Location','');require(url,'Anonymous source redirect missing')\n        except(urllib.error.URLError,TimeoutError):raise RuntimeError('Anonymous source unavailable')from None\n    raise RuntimeError('Anonymous redirect limit')\ndef reconstruct():\n    keys=sorted(k for k in os.environ if re.fullmatch(r'BERG_RECIPE_[0-9]{3}',k));require(keys,'Exact ZIP reconstruction recipe unavailable');recipe=json.loads(zlib.decompress(base64.b64decode(''.join(os.environ[k]for k in keys),validate=True)))\n    require(recipe['bytes']==849271346 and recipe['sha256']=='ec7b8e2d4e5cdd6a15aaca7b8bbad59ca834918d3a01488e7885ab6d89f0bfa8'and len(recipe['members'])==105,'Fixed original Bergamot source required')\n    with tempfile.TemporaryDirectory(prefix='birostris-public-source-')as temporary:\n        directory=pathlib.Path(temporary)\n        def fetch(row):\n            data=public_bytes(row,row['url'],True)if'url'in row else checked(row,zlib.decompress(base64.b64decode(row['zlib'],validate=True)));dest=directory/hashlib.sha256(row['path'].encode()).hexdigest();dest.write_bytes(data);return row['path'],dest\n        with concurrent.futures.ThreadPoolExecutor(max_workers=4)as pool:payloads=dict(pool.map(fetch,recipe['members']))\n        output=directory/'fixed-source.zip';digest=hashlib.sha256();count=0\n        with output.open('wb')as out:\n            def write(data):\n                nonlocal count\n                out.write(data);digest.update(data);count+=len(data)\n            for row in recipe['members']:\n                write(base64.b64decode(row['prefix'],validate=True))\n                with payloads[row['path']].open('rb')as stream:\n                    for block in iter(lambda:stream.read(1024*1024),b''):write(block)\n            write(base64.b64decode(recipe['footer'],validate=True))\n        require(count==recipe['bytes']and digest.hexdigest()==recipe['sha256'],'Exact original ZIP reconstruction mismatch')\n        with zipfile.ZipFile(output)as archive:\n            require(archive.testzip()is None,'Reconstructed source CRC failure');inventory=json.loads(archive.read('package-manifest.json'));require(len(archive.namelist())==105,'Source inventory differs')\n            for row in inventory['files']:\n                digest=hashlib.sha256();count=0\n                with archive.open(row['path'])as stream:\n                    for block in iter(lambda:stream.read(1024*1024),b''):digest.update(block);count+=len(block)\n                require((count,digest.hexdigest())==(row['bytes'],row['sha256']),'Reconstructed source member differs')\n        print(json.dumps({'sourceReconstructed':True,'members':105,'bytes':recipe['bytes'],'sha256':recipe['sha256'],'allPublicInputBytesVerified':True}),flush=True)\n        return output.read_bytes()\ndef assets(release_id):\n    rows=api(PREFIX+'/releases/'+str(release_id)+'/assets?per_page=100');require(isinstance(rows,list)and len(rows)<=len(EXPECTED)and len({r.get('name')for r in rows})==len(rows)and all(r.get('name')in NAMES for r in rows),'Unexpected source assets: no overwrite permitted');return {r['name']:r for r in rows}\ndef main():\n    require(os.environ.get('GITHUB_REPOSITORY')==REPOSITORY and os.environ.get('GITHUB_EVENT_NAME')=='push'and os.environ.get('GITHUB_REF')=='refs/heads/main','Only intended repository main push is allowed');commit=os.environ.get('GITHUB_SHA','');require(re.fullmatch('[a-f0-9]{40}',commit),'Fixed workflow commit required')\n    materials={}\n    for row in EXPECTED:\n        data=reconstruct()if row.get('reconstruct')else base64.b64decode(os.environ[row['embedded']],validate=True)if'embedded'in row else public_bytes(row,row['historicalUrl']);materials[row['name']]=checked(row,data)\n    manifest_bytes=materials['SOURCE-MANIFEST.json'];manifest=json.loads(manifest_bytes);signature=json.loads(materials['SOURCE-MANIFEST.signature.json'])\n    require(hashlib.sha256(manifest_bytes).hexdigest()==CONFIG['manifestSha256']and signature['manifestSha256']==CONFIG['manifestSha256']and signature['algorithm']=='Ed25519'and signature['publicKey']==CONFIG['signingPublicKey']and len(base64.b64decode(signature['signature'],validate=True))==64,'Fixed locally signature-verified manifest required')\n    require(manifest['repository']==REPOSITORY and manifest['appVersion']==VERSION and manifest['tag']==TAG,'Signed source identity differs')\n    for source in manifest['components']+[manifest['applicationSource']]+([manifest['mobileTranslationSource']]if VERSION=='0.2.3'else[]):\n        name=source['url'].rsplit('/',1)[-1];row=next((r for r in EXPECTED if r['name']==name),None);require(row and source['url']==f'https://github.com/{REPOSITORY}/releases/download/{TAG}/{name}'and source['sourceApplicableToVersion']==VERSION and source['archive']['bytes']==row['bytes']and source['archive']['sha256']==row['sha256'],'Fixed source archive mapping differs')\n    app=manifest['applicationSource'];require(len(app['files'])==20,'Current helper20-file inventory required')\n    with zipfile.ZipFile(io.BytesIO(materials[app['url'].rsplit('/',1)[-1]]))as archive:\n        require(archive.testzip()is None and set(archive.namelist())=={r['path']for r in app['files']}|{'SOURCE-ARCHIVE-MANIFEST.json'},'Helper source CRC/inventory differs')\n        for row in app['files']:checked(row,archive.read(row['path']))\n    repository=api(PREFIX);require(repository.get('full_name')==REPOSITORY and repository.get('private')is False,'Public source repository required')\n    try:release=api(PREFIX+'/releases/tags/'+TAG)\n    except ApiStatus as failure:\n        require(failure.status==404,'Source release lookup failed');release=api(PREFIX+'/releases','POST',{'tag_name':TAG,'target_commitish':commit,'name':f'Birostris Viewer {VERSION} corresponding sources','body':'Permanent corresponding-source materials, exact signed source/binary mapping and full anonymous byte verification. Original source payloads and historical releases are preserved. No app release, feed promotion, user data, credentials or signing keys.','draft':False,'prerelease':False,'make_latest':'false'})\n    require(release.get('tag_name')==TAG and release.get('draft')is False and type(release.get('id'))is int and release['id']>0,'Unexpected source release');release_id=release['id'];existing=assets(release_id)\n    for row in EXPECTED:\n        url=f'https://github.com/{REPOSITORY}/releases/download/{TAG}/{row[\"name\"]}'\n        if row['name']in existing:\n            old=existing[row['name']];require(old.get('size')==row['bytes']and old.get('state')=='uploaded','Existing source asset differs; refuse overwrite');checked(row,public_bytes(row,url));continue\n        uploaded=api(PREFIX+'/releases/'+str(release_id)+'/assets?'+urllib.parse.urlencode({'name':row['name']}),'POST',materials[row['name']],True);require(uploaded.get('name')==row['name']and uploaded.get('size')==row['bytes']and uploaded.get('state')=='uploaded','Uploaded source metadata differs');print(json.dumps({'sourceAssetUploaded':row['name'],'bytes':row['bytes']}),flush=True)\n    require(set(assets(release_id))==NAMES,'Permanent source inventory incomplete')\n    for row in EXPECTED:\n        checked(row,public_bytes(row,f'https://github.com/{REPOSITORY}/releases/download/{TAG}/{row[\"name\"]}'));print(json.dumps({'anonymousSourceVerified':row['name'],'bytes':row['bytes'],'sha256':row['sha256'],'credentialsUsed':False}),flush=True)\n    print(json.dumps({'published':True,'repository':REPOSITORY,'tag':TAG,'anonymousFullBytesVerified':True,'files':len(EXPECTED),'historicalReleasesModified':False,'appPromotionPerformed':False}),flush=True)\nif __name__=='__main__':\n    try:main()\n    except Exception as error:\n        # Exception type and fixed stage text only; never log bearer/redirect URLs or response bodies.\n        print('Fixed corresponding-source publication failed closed: '+type(error).__name__+' '+str(error)if isinstance(error,RuntimeError)else'Fixed corresponding-source publication failed closed: '+type(error).__name__,file=sys.stderr);sys.exit(1)\n"
        }
      ]
    }
  }
}
